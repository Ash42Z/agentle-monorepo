<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A home for the services built by Agentle.">
  <title>Agentle — a home for services</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #101820; color: #edf4f5; }
    main { max-width: 42rem; padding: 3rem 1.5rem; }
    .badge { color: #79dfbc; letter-spacing: .12em; font-size: .8rem; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.1; margin: 1rem 0; }
    p { color: #b7c8ce; font-size: 1.15rem; line-height: 1.7; }
    footer { border-top: 1px solid #30424b; margin-top: 3rem; padding-top: 1rem; color: #b7c8ce; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Agentle · agentle.cc</span>
    <h1>A home for what’s next.</h1>
    <p>This is the first page in a growing collection of services. More tools and experiments will find a home here as they’re built.</p>
    <footer>Built in one monorepo. Served by Caddy.</footer>
  </main>
</body>
</html>
