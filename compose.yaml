services:
  bot:
    image: ${AGENTLE_IMAGE:?Set AGENTLE_IMAGE}
    restart: unless-stopped
    init: true
    stop_grace_period: 6h
    environment:
      AGENTLE_RELEASE: ${AGENTLE_RELEASE:?Set AGENTLE_RELEASE}
      AGENTLE_DATA: /data
      AGENTLE_CODEX_HOME: /codex
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /root/.config/agentle:/config:ro
      - /root/agentle-data:/data
      - /root/agentle-data/codex:/codex
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');fetch('http://127.0.0.1:8080/ready',{headers:{Authorization:'Bearer '+fs.readFileSync('/config/admin-token','utf8').trim()}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: ${AGENTLE_WEB_IMAGE:?Set AGENTLE_WEB_IMAGE}
    restart: unless-stopped
    environment:
      AGENTLE_RELEASE: ${AGENTLE_RELEASE:?Set AGENTLE_RELEASE}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  caddy_data:
  caddy_config:
